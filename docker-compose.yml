services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.dev}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: