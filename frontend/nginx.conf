server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths fall back to index.html 
  # so React Router handles them (reload on /imports/123 must not return a 404).
  location / {
    try_files $uri /index.html;
  }

  # "/api/x" -> backend "/x". The trailing slash on proxy_pass strips the prefix,
  # which is the same rewrite as the Vite dev server.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # NDJSON streams must reach the browser as they are produced.
    proxy_buffering off;
    # Large imports and 1M-row streams can run for minutes.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Must stay above MAX_UPLOAD_MB (500) from the .env files.
    client_max_body_size 600m;
  }
}